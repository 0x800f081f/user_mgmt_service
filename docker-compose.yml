services:

  traefik:
    image: traefik:latest
    command:
      - "--providers.docker=true"
      - "--configFile=/etc/traefik/traefik.yml"
    environment:
      # Traefik führt Umgebungsvariablen automatisch mit der statischen
      # Konfigurationsdatei zusammen (Format: TRAEFIK_<PFAD_IN_GROSSBUCHSTABEN>)
      - "TRAEFIK_CERTIFICATESRESOLVERS_PROXY_ACME_EMAIL=${TRAEFIK_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Traefik Dashboard (http://localhost:8081)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    depends_on:
      - backend


  backend:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    links:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=proxy"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=proxy"
      - "traefik.http.services.backend.loadbalancer.server.port=80"


  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${SPRING_DATASOURCE_USERNAME}"
      POSTGRES_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      POSTGRES_DB: "postgres"
    volumes:
      - db-data:/var/lib/postgres

volumes:
  db-data: {}
  letsencrypt: {}