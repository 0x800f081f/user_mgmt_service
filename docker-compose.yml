services:

  traefik:
    image: traefik:latest
    command:
      - "--providers.docker=true"
      - "--configFile=/etc/traefik/traefik.yml"
    environment:
      # Traefik führt Umgebungsvariablen automatisch mit der statischen
      # Konfigurationsdatei zusammen (Format: TRAEFIK_<PFAD_IN_GROSSBUCHSTABEN>)
      - "TRAEFIK_CERTIFICATESRESOLVERS_PROXY_ACME_EMAIL=${TRAEFIK_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Traefik Dashboard (http://localhost:8081)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: .
    image: ghcr.io/0x800f081f/user_mgmt_service-backend
    env_file:
      - .env
    depends_on:
      - db
    links:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.gardalus.ch`) && PathPrefix(`/api/users`)"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=strip-api"
      - "traefik.http.routers.backend.entrypoints=proxy"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=proxy"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./src-ui
      dockerfile: Dockerfile
      args:
        # Die URL wird bereits beim Build benötigt.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    image: ghcr.io/0x800f081f/user_mgmt_service-frontend
    environment:
      - "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`api.gardalus.ch`) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=proxy"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=proxy"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${SPRING_DATASOURCE_USERNAME}"
      POSTGRES_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      POSTGRES_DB: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: {}
  letsencrypt: {}
